<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌟 Fanny 媽媽專屬秘密解答手札 ｜ 晚間對答案</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'fanny-pink': '#be185d',
                        'fanny-purple': '#581c87',
                        'fanny-gold': '#b45309'
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome 6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>

    <style>
        [x-cloak] { display: none !important; }
        .day-active {
            background: linear-gradient(135deg, #be185d, #831843) !important;
            color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(190, 24, 93, 0.35);
            font-weight: 800;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-rose-50 via-slate-50 to-amber-50 text-slate-800 min-h-screen pb-16 font-sans antialiased" x-data="answersApp()" x-cloak>

    <!-- Top Header -->
    <header class="bg-gradient-to-r from-[#831843] via-[#be185d] to-[#701a75] text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-3xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div>
                <div class="flex items-center space-x-2">
                    <span class="bg-white/20 text-white text-[11px] px-2.5 py-0.5 rounded-full font-bold border border-white/30">
                        🔒 爸媽專屬機密 ｜ 不對外公開
                    </span>
                </div>
                <h1 class="text-lg sm:text-xl font-black mt-0.5 flex items-center tracking-tight">
                    <span>🌟 Fanny 媽媽專屬秘密解答手札</span>
                </h1>
            </div>
            <div class="text-right">
                <span class="text-xs bg-amber-400 text-rose-950 font-black px-2.5 py-1 rounded-xl shadow">
                    佳恩 ＆ 芊瑾 晚間對答案
                </span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl mx-auto px-3 sm:px-4 py-3.5 space-y-3.5">

        <!-- Top Guide Card -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-rose-200">
            <div class="flex items-start space-x-3">
                <div class="w-10 h-10 rounded-xl bg-rose-100 text-rose-700 flex items-center justify-center shrink-0 text-xl font-bold">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <div class="text-xs sm:text-sm text-slate-700 space-y-1">
                    <div class="font-bold text-slate-900 text-sm sm:text-base flex items-center">
                        <span>媽媽每晚 5 分鐘闖關引導指南</span>
                    </div>
                    <p class="leading-relaxed">
                        每天回飯店洗完澡後，和兩姊妹一起回顧當天的景點題目。每答對一題給予滿滿讚美，全數答完可頒發「當晚超商甜點加碼」或「隔天扭蛋 1 次」小獎勵！
                    </p>
                    <div class="pt-1 flex flex-wrap gap-2 text-[11px] sm:text-xs font-semibold text-rose-800">
                        <span class="bg-rose-50 px-2 py-0.5 rounded-md border border-rose-200">💡 匯率換算：日幣 ÷ 4.6 (約 x 0.22)</span>
                        <span class="bg-amber-50 text-amber-900 px-2 py-0.5 rounded-md border border-amber-200">💰 例：¥1,000 ≈ NT$ 217 元</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 7 Days Grid Selector -->
        <div class="grid grid-cols-7 gap-1 sm:gap-1.5 p-1.5 bg-white rounded-xl shadow-sm border border-slate-200">
            <template x-for="(d, idx) in days" :key="idx">
                <button @click="currentDay = idx" 
                        :class="currentDay === idx ? 'day-active' : 'bg-slate-50 text-slate-700 hover:bg-rose-50'"
                        class="py-2 rounded-lg text-center transition-all flex flex-col items-center">
                    <span class="text-xs font-semibold" x-text="'D' + (idx+1)"></span>
                    <span class="text-[11px] sm:text-xs font-bold leading-tight" x-text="d.shortDate"></span>
                </button>
            </template>
        </div>

        <!-- Current Day Title Banner -->
        <div class="bg-gradient-to-r from-rose-900 via-pink-900 to-purple-950 text-white p-4 rounded-2xl shadow-sm flex items-center justify-between">
            <div>
                <span class="text-xs font-bold text-rose-300" x-text="days[currentDay].fullDate"></span>
                <h2 class="text-base sm:text-lg font-black text-white mt-0.5" x-text="days[currentDay].title"></h2>
            </div>
            <span class="text-xs font-bold bg-white/20 px-3 py-1 rounded-full border border-white/30" x-text="'共 ' + days[currentDay].spots.length + ' 個景點解答'"></span>
        </div>

        <!-- Spots & Answers Card List -->
        <div class="space-y-3.5">
            <template x-for="(spot, sIdx) in days[currentDay].spots" :key="sIdx">
                <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-rose-100 space-y-3">
                    
                    <!-- Spot Title -->
                    <div class="flex items-center justify-between border-b border-slate-100 pb-2.5">
                        <div class="flex items-center space-x-2">
                            <span class="w-6 h-6 rounded-full bg-rose-600 text-white text-xs font-black flex items-center justify-center" x-text="sIdx + 1"></span>
                            <h3 class="font-black text-slate-900 text-base sm:text-lg" x-text="spot.name"></h3>
                        </div>
                    </div>

                    <!-- Quests and Answers -->
                    <div class="space-y-3">
                        <template x-for="(q, qIdx) in spot.quests" :key="qIdx">
                            <div class="bg-rose-50/50 p-3.5 rounded-xl border border-rose-200/80 space-y-2">
                                <div class="flex items-start space-x-2">
                                    <span class="text-xs font-bold px-2 py-0.5 rounded-md bg-rose-200 text-rose-900 shrink-0 mt-0.5" x-text="q.type"></span>
                                    <p class="text-xs sm:text-sm font-bold text-slate-800" x-text="q.q"></p>
                                </div>

                                <!-- Correct Answer Box -->
                                <div class="bg-white p-3 rounded-lg border-l-4 border-emerald-500 shadow-xs space-y-1">
                                    <div class="text-xs font-black text-emerald-800 flex items-center">
                                        <i class="fa-solid fa-circle-check text-emerald-600 mr-1.5"></i>
                                        <span>標準解答：</span>
                                    </div>
                                    <p class="text-xs sm:text-sm font-bold text-slate-900 leading-relaxed" x-text="q.ans"></p>
                                    
                                    <template x-if="q.lore">
                                        <div class="pt-1 text-xs text-slate-600 leading-relaxed bg-slate-50 p-2 rounded border border-slate-200/60">
                                            <span class="font-bold text-amber-800">💡 媽媽趣味補充解說：</span>
                                            <span x-text="q.lore"></span>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>

                </div>
            </template>
        </div>

        <!-- Evening Reward Suggestions Card -->
        <div class="bg-gradient-to-r from-amber-100 to-orange-100 p-4 rounded-2xl border border-amber-300 shadow-xs">
            <h4 class="font-black text-amber-950 text-sm sm:text-base flex items-center mb-1.5">
                <i class="fa-solid fa-gift text-amber-600 mr-2 text-lg"></i>
                今晚過關獎勵建議 (媽媽自由選擇)
            </h4>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs font-bold text-amber-900">
                <div class="bg-white/90 p-2.5 rounded-xl border border-amber-200 flex items-center">
                    <span class="text-base mr-2">🍦</span>
                    <span>北海道濃郁牛奶霜淇淋 / 雪糕</span>
                </div>
                <div class="bg-white/90 p-2.5 rounded-xl border border-amber-200 flex items-center">
                    <span class="text-base mr-2">🪙</span>
                    <span>隔日扭蛋機 1 次代幣資格</span>
                </div>
                <div class="bg-white/90 p-2.5 rounded-xl border border-amber-200 flex items-center">
                    <span class="text-base mr-2">🍮</span>
                    <span>日本超商限定烤布丁 / 麝香葡萄</span>
                </div>
            </div>
        </div>

    </main>
